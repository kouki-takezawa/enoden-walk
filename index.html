<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>江ノ電 鎌倉高校前 散歩</title>
  <meta name="description" content="江ノ電 鎌倉高校前駅・1号踏切の周辺を、人物を操作して歩き回れる3Dウェブアプリ。電車に乗る・夜の景色・写真モード。地形・建物は国土交通省 PLATEAU をもとに生成。" />
  <meta name="theme-color" content="#f0b98a" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="江ノ電 鎌倉高校前 散歩" />
  <meta property="og:description" content="夕暮れの1号踏切と相模湾の見える丘の街を、人物を操作して歩こう。電車に乗る・夜の景色・写真モード。" />
  <meta property="og:image" content="https://enoden-walk.vercel.app/og.jpg" />
  <meta property="og:url" content="https://enoden-walk.vercel.app/" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="c" tabindex="-1"></canvas>

  <div id="loading" class="panel center" role="dialog" aria-labelledby="ttl">
    <div class="langsw"><button data-lang="ja">JA</button><button data-lang="en">EN</button></div>
    <h1 id="ttl" data-i18n="title">江ノ電 鎌倉高校前 散歩</h1>
    <p class="sub" data-i18n="subtitle">夕暮れの1号踏切と、相模湾の見える丘の街を歩こう</p>
    <div class="bar"><div id="barfill"></div></div>
    <p id="loadtext" data-i18n="loading">読み込み中…</p>
    <button id="start" disabled data-i18n="start">散歩をはじめる</button>
    <button id="retry" class="hidden" data-i18n="retry">やり直す</button>
    <div id="helpbody" class="keys"></div>
    <p class="credit" data-i18n-html="credit"></p>
  </div>

  <div id="hud" class="hidden">
    <div id="where"></div>
    <div id="toolbar">
      <button id="bTime" aria-label="time of day"></button>
      <button id="bSpots" aria-label="spots"></button>
      <button id="bPhoto" aria-label="photo mode"></button>
      <button id="bSet" aria-label="settings"></button>
      <button id="bHelp" aria-label="help"></button>
    </div>
    <div id="msg" role="status" aria-live="polite"></div>
    <div id="prompt" class="hidden" role="status" aria-live="polite"></div>
    <div id="trainbox"><span id="trainicon"></span><span id="traintext"></span></div>
    <div id="quick"><button id="bGoPf" class="hidden"></button><button id="bCall" class="hidden"></button></div>
    <div id="navbar" class="hidden"><span id="navArrow" aria-hidden="true">▲</span><span id="navText"></span><button id="navAuto"></button><button id="navStop">✕</button></div>
    <div id="mapwrap"><canvas id="map" width="176" height="176"></canvas><span id="mapN">N</span></div>
    <div id="fps" class="hidden"></div>
    <div id="help" data-i18n="helpShort">WASD 移動 ・ Shift 走る ・ Space ジャンプ ・ E 乗る ・ ？ ガイド</div>
  </div>

  <div id="touch" class="hidden">
    <div id="stick"><div id="knob"></div></div>
    <div id="btns">
      <button id="bBoard" class="hidden"></button>
      <button id="bJump">ジャンプ</button>
    </div>
  </div>
  <div id="tutorial" class="hidden"><div class="tutarrow"></div><p data-i18n="tutorial_text"></p></div>

  <div id="photo" class="hidden"></div>
  <div id="mapOverlay" class="hidden"><canvas id="mapBig" width="340" height="340"></canvas><button id="mapOverlayClose" class="close" aria-label="close">✕</button></div>
  <div id="modal" class="hidden"></div>
  <div id="fade"></div>
  <div id="installBanner" class="hidden" role="status">
    <span id="installText"></span>
    <button id="installBtn" class="hidden" data-i18n="install_btn"></button>
    <button id="installDismiss" aria-label="dismiss">✕</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
